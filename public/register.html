<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#2e7d32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link rel="manifest" href="/manifest.json">

    <title>Create Account | Expense Tracker</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section
            class="auth-card"
            aria-labelledby="registerTitle"
        >

            <div class="auth-brand">

                <div class="auth-brand-icon" aria-hidden="true">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div>
                    <h1 id="registerTitle">
                        Create Account
                    </h1>

                    <p>
                        Register to start tracking your income and expenses.
                    </p>
                </div>

            </div>

            <div
                class="auth-message"
                id="registerMessage"
                role="status"
                aria-live="polite"
            ></div>

            <form
                class="auth-form"
                id="registerForm"
                novalidate
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-with-icon">

                        <i
                            class="fa-solid fa-user"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            minlength="2"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-with-icon">

                        <i
                            class="fa-solid fa-envelope"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            inputmode="email"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <i
                            class="fa-solid fa-lock password-leading-icon"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePasswordButton"
                            aria-label="Show password"
                            aria-pressed="false"
                        >

                            <i
                                class="fa-solid fa-eye-slash"
                                aria-hidden="true"
                            ></i>

                        </button>

                    </div>

                    <small class="form-help">
                        Use at least 6 characters.
                    </small>

                </div>

                <button
                    type="submit"
                    class="primary-action-btn auth-submit-btn"
                    id="registerButton"
                >

                    <span id="registerButtonText">
                        Register
                    </span>

                    <i
                        class="fa-solid fa-user-plus"
                        aria-hidden="true"
                    ></i>

                </button>

            </form>

            <p class="auth-switch-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>

    <script>
        "use strict";

        const registerForm =
            document.getElementById("registerForm");

        const usernameInput =
            document.getElementById("username");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const togglePasswordButton =
            document.getElementById("togglePasswordButton");

        const registerButton =
            document.getElementById("registerButton");

        const registerButtonText =
            document.getElementById("registerButtonText");

        const registerMessage =
            document.getElementById("registerMessage");


        if (localStorage.getItem("userId")) {
            window.location.replace("index.html");
        }


        function showRegisterMessage(
            message,
            type = "error"
        ) {

            registerMessage.textContent = message;

            registerMessage.className =
                "auth-message " + type;

        }


        function clearRegisterMessage() {

            registerMessage.textContent = "";

            registerMessage.className =
                "auth-message";

        }


        function setRegisterLoading(isLoading) {

            registerButton.disabled = isLoading;

            registerButton.setAttribute(
                "aria-busy",
                String(isLoading)
            );

            registerButtonText.textContent =
                isLoading
                    ? "Creating account..."
                    : "Register";

        }


        function togglePasswordVisibility() {

            const isHidden =
                passwordInput.type === "password";

            passwordInput.type =
                isHidden
                    ? "text"
                    : "password";

            const icon =
                togglePasswordButton.querySelector("i");

            icon.classList.toggle(
                "fa-eye",
                isHidden
            );

            icon.classList.toggle(
                "fa-eye-slash",
                !isHidden
            );

            togglePasswordButton.setAttribute(
                "aria-label",
                isHidden
                    ? "Hide password"
                    : "Show password"
            );

            togglePasswordButton.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

        }


        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        }


        async function registerUser(event) {

            event.preventDefault();

            clearRegisterMessage();

            const username =
                usernameInput.value.trim();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            if (!username || !email || !password) {

                showRegisterMessage(
                    "Please complete all required fields."
                );

                if (!username) {
                    usernameInput.focus();
                }
                else if (!email) {
                    emailInput.focus();
                }
                else {
                    passwordInput.focus();
                }

                return;
            }

            if (username.length < 2) {

                showRegisterMessage(
                    "Username must contain at least 2 characters."
                );

                usernameInput.focus();

                return;
            }

            if (!isValidEmail(email)) {

                showRegisterMessage(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;
            }

            if (password.length < 6) {

                showRegisterMessage(
                    "Password must contain at least 6 characters."
                );

                passwordInput.focus();

                return;
            }

            setRegisterLoading(true);

            try {

                const response =
                    await fetch("/register", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            email,
                            password
                        })

                    });

                let data = {};

                try {
                    data = await response.json();
                }
                catch {
                    data = {};
                }

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Registration failed. Please try again."
                    );

                }

                const registrationSucceeded =
                    data.success === true ||
                    data.message ===
                        "Registration successful";

                if (!registrationSucceeded) {

                    throw new Error(
                        data.message ||
                        "Registration failed. Please try again."
                    );

                }

                showRegisterMessage(
                    data.message ||
                    "Registration successful. Redirecting to login...",
                    "success"
                );

                registerForm.reset();

                window.setTimeout(function () {
                    window.location.replace("login.html");
                }, 800);

            }
            catch (error) {

                showRegisterMessage(
                    error.message === "Failed to fetch"
                        ? "Unable to connect to the server."
                        : error.message
                );

                setRegisterLoading(false);

            }

        }


        togglePasswordButton.addEventListener(
            "click",
            togglePasswordVisibility
        );

        registerForm.addEventListener(
            "submit",
            registerUser
        );


        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("/service-worker.js")
                        .then(function () {
                            console.log(
                                "Service worker registered."
                            );
                        })
                        .catch(function (error) {
                            console.error(
                                "Service worker registration failed:",
                                error
                            );
                        });

                }
            );

        }
    </script>

</body>

</html>
