<!DOCTYPE html>
<html lang="en">

<head>
<meta name="color-scheme" content="light dark">
<style id="theme-paint-bootstrap">
:root {
    color-scheme: light;
    background: #eef8f0;
}
html, body {
    min-height: 100%;
    background-color: #eef8f0;
}
html.dark-mode {
    color-scheme: dark;
    background: #0b120e !important;
}
html.dark-mode body {
    background-color: #0b120e !important;
}
</style>
<script id="theme-bootstrap">
(function () {
    try {
        var key = "expenseTrackerTheme";
        var saved = localStorage.getItem(key) || "light";
        var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark =
            saved === "dark" ||
            (saved === "system" && systemDark);

        var root = document.documentElement;
        root.classList.toggle("dark-mode", dark);
        root.dataset.theme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#0b120e" : "#eef8f0";
        root.style.colorScheme = dark ? "dark" : "light";
    } catch (error) {
        document.documentElement.style.backgroundColor = "#eef8f0";
    }
})();
</script>
<script src="/theme.js" defer></script>

<meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#2e7d32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link rel="manifest" href="/manifest.json">

    <title>Login | Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
<link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section
            class="auth-card"
            aria-labelledby="loginTitle"
        >

            <div class="auth-brand">

                <div class="auth-brand-icon" aria-hidden="true">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div>
                    <h1 id="loginTitle">Welcome Back</h1>

                    <p>
                        Sign in to continue managing your finances.
                    </p>
                </div>

            </div>

            <div
                class="auth-message"
                id="loginMessage"
                role="status"
                aria-live="polite"
            ></div>

            <form
                class="auth-form"
                id="loginForm"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-with-icon">

                        <i
                            class="fa-solid fa-envelope"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            inputmode="email"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <i
                            class="fa-solid fa-lock password-leading-icon"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePasswordButton"
                            aria-label="Show password"
                            aria-pressed="false"
                        >

                            <i
                                class="fa-solid fa-eye-slash"
                                aria-hidden="true"
                            ></i>

                        </button>

                    </div>

                </div>

                <div class="auth-form-options">
                    <button type="button" class="auth-text-button" id="forgotPasswordButton">
                        Forgot Password?
                    </button>
                </div>

                <button
                    type="submit"
                    class="primary-action-btn auth-submit-btn"
                    id="loginButton"
                >

                    <span id="loginButtonText">
                        Login
                    </span>

                    <i
                        class="fa-solid fa-arrow-right-to-bracket"
                        aria-hidden="true"
                    ></i>

                </button>

            </form>

            <p class="auth-switch-text">
                Don't have an account?

                <a href="register.html">
                    Register
                </a>
            </p>

        </section>

    </main>

    <div class="auth-modal" id="forgotPasswordModal" aria-hidden="true">
        <div class="auth-modal-backdrop" id="forgotPasswordBackdrop"></div>
        <section class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle">
            <button type="button" class="auth-modal-close" id="closeForgotPasswordButton" aria-label="Close forgot password form">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="auth-modal-heading">
                <div class="auth-modal-icon"><i class="fa-solid fa-key"></i></div>
                <h2 id="forgotPasswordTitle">Reset Password</h2>
                <p>Request a code, then enter it with your new password.</p>
            </div>
            <div class="auth-message" id="forgotPasswordMessage" role="status" aria-live="polite"></div>
            <form class="auth-form" id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="resetEmail" placeholder="Enter your registered email" autocomplete="email" required>
                    </div>
                </div>
                <button type="submit" class="secondary-auth-btn" id="sendResetCodeButton">
                    <span id="sendResetCodeText">Send Reset Code</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            <form class="auth-form reset-password-form" id="resetPasswordForm" novalidate hidden>
                <div class="form-group">
                    <label for="resetCode">6-Digit Reset Code</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        <input type="text" id="resetCode" placeholder="Enter the 6-digit code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-box">
                        <i class="fa-solid fa-lock password-leading-icon" aria-hidden="true"></i>
                        <input type="password" id="newPassword" placeholder="Enter a new password" autocomplete="new-password" minlength="6" required>
                        <button type="button" class="show-password" id="toggleNewPasswordButton" aria-label="Show new password" aria-pressed="false">
                            <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                        </button>
                    </div>
                    <small class="form-help">Use at least 6 characters.</small>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <div class="password-box">
                        <i class="fa-solid fa-lock password-leading-icon" aria-hidden="true"></i>
                        <input type="password" id="confirmNewPassword" placeholder="Confirm your new password" autocomplete="new-password" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="primary-action-btn auth-submit-btn" id="resetPasswordButton">
                    <span id="resetPasswordButtonText">Reset Password</span>
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </form>
        </section>
    </div>

    <script>
        "use strict";

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const togglePasswordButton =
            document.getElementById("togglePasswordButton");

        const loginButton =
            document.getElementById("loginButton");

        const loginButtonText =
            document.getElementById("loginButtonText");

        const loginMessage =
            document.getElementById("loginMessage");

        const forgotPasswordButton = document.getElementById("forgotPasswordButton");
        const forgotPasswordModal = document.getElementById("forgotPasswordModal");
        const forgotPasswordBackdrop = document.getElementById("forgotPasswordBackdrop");
        const closeForgotPasswordButton = document.getElementById("closeForgotPasswordButton");
        const forgotPasswordMessage = document.getElementById("forgotPasswordMessage");
        const forgotPasswordForm = document.getElementById("forgotPasswordForm");
        const resetPasswordForm = document.getElementById("resetPasswordForm");
        const resetEmailInput = document.getElementById("resetEmail");
        const resetCodeInput = document.getElementById("resetCode");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmNewPasswordInput = document.getElementById("confirmNewPassword");
        const sendResetCodeButton = document.getElementById("sendResetCodeButton");
        const sendResetCodeText = document.getElementById("sendResetCodeText");
        const resetPasswordButton = document.getElementById("resetPasswordButton");
        const resetPasswordButtonText = document.getElementById("resetPasswordButtonText");
        const toggleNewPasswordButton = document.getElementById("toggleNewPasswordButton");


        if (localStorage.getItem("userId")) {
            window.location.replace("index.html");
        }


        function showLoginMessage(message, type = "error") {

            loginMessage.textContent = message;

            loginMessage.className =
                "auth-message " + type;

        }


        function clearLoginMessage() {

            loginMessage.textContent = "";

            loginMessage.className =
                "auth-message";

        }


        function setLoadingState(isLoading) {

            loginButton.disabled = isLoading;

            loginButton.setAttribute(
                "aria-busy",
                String(isLoading)
            );

            loginButtonText.textContent =
                isLoading
                    ? "Signing in..."
                    : "Login";

        }


        function togglePasswordVisibility() {

            const isPasswordHidden =
                passwordInput.type === "password";

            passwordInput.type =
                isPasswordHidden
                    ? "text"
                    : "password";

            const icon =
                togglePasswordButton.querySelector("i");

            icon.classList.toggle(
                "fa-eye",
                isPasswordHidden
            );

            icon.classList.toggle(
                "fa-eye-slash",
                !isPasswordHidden
            );

            togglePasswordButton.setAttribute(
                "aria-label",
                isPasswordHidden
                    ? "Hide password"
                    : "Show password"
            );

            togglePasswordButton.setAttribute(
                "aria-pressed",
                String(isPasswordHidden)
            );

        }


        async function loginUser(event) {

            event.preventDefault();

            clearLoginMessage();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            if (!email || !password) {

                showLoginMessage(
                    "Please enter your email and password."
                );

                if (!email) {
                    emailInput.focus();
                }
                else {
                    passwordInput.focus();
                }

                return;
            }

            setLoadingState(true);

            try {

                const response =
                    await fetch("/login", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })

                    });

                let data = {};

                try {
                    data = await response.json();
                }
                catch {
                    data = {};
                }

                if (!response.ok || !data.success) {

                    if (data.requiresVerification && data.email) {

                        localStorage.setItem(
                            "pendingVerificationEmail",
                            data.email
                        );

                        showLoginMessage(
                            data.message +
                            " Redirecting to verification..."
                        );

                        window.setTimeout(function () {
                            window.location.replace("register.html");
                        }, 900);

                        return;

                    }

                    throw new Error(
                        data.message ||
                        "Unable to sign in. Please try again."
                    );

                }

                localStorage.setItem(
                    "userId",
                    String(data.userId)
                );

                localStorage.setItem(
                    "username",
                    data.username || "User"
                );

                showLoginMessage(
                    "Login successful. Redirecting...",
                    "success"
                );

                window.setTimeout(function () {
                    window.location.replace("index.html");
                }, 500);

            }
            catch (error) {

                showLoginMessage(
                    error.message === "Failed to fetch"
                        ? "Unable to connect to the server."
                        : error.message
                );

                setLoadingState(false);

            }

        }


        function showForgotPasswordMessage(message, type = "error") {
            forgotPasswordMessage.textContent = message;
            forgotPasswordMessage.className = "auth-message " + type;
        }

        function clearForgotPasswordMessage() {
            forgotPasswordMessage.textContent = "";
            forgotPasswordMessage.className = "auth-message";
        }

        function openForgotPasswordModal() {
            clearForgotPasswordMessage();
            resetEmailInput.value = emailInput.value.trim();
            forgotPasswordModal.classList.add("active");
            forgotPasswordModal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            setTimeout(() => resetEmailInput.focus(), 50);
        }

        function closeForgotPasswordModal() {
            forgotPasswordModal.classList.remove("active");
            forgotPasswordModal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
        }

        function toggleNewPasswordVisibility() {
            const hidden = newPasswordInput.type === "password";
            newPasswordInput.type = hidden ? "text" : "password";
            const icon = toggleNewPasswordButton.querySelector("i");
            icon.classList.toggle("fa-eye", hidden);
            icon.classList.toggle("fa-eye-slash", !hidden);
        }

        async function requestResetCode(event) {
            event.preventDefault();
            clearForgotPasswordMessage();
            const email = resetEmailInput.value.trim();
            if (!email) {
                showForgotPasswordMessage("Enter your registered email address.");
                resetEmailInput.focus();
                return;
            }
            sendResetCodeButton.disabled = true;
            sendResetCodeText.textContent = "Sending code...";
            try {
                const response = await fetch("/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.message || "Unable to send the reset code.");
                resetPasswordForm.hidden = false;
                showForgotPasswordMessage(data.message, "success");
                resetCodeInput.focus();
            } catch (error) {
                showForgotPasswordMessage(error.message === "Failed to fetch" ? "Unable to connect to the server." : error.message);
            } finally {
                sendResetCodeButton.disabled = false;
                sendResetCodeText.textContent = "Send Reset Code";
            }
        }

        async function resetPassword(event) {
            event.preventDefault();
            clearForgotPasswordMessage();
            const email = resetEmailInput.value.trim();
            const code = resetCodeInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmNewPasswordInput.value;
            if (!/^\d{6}$/.test(code)) {
                showForgotPasswordMessage("Enter the 6-digit reset code.");
                resetCodeInput.focus();
                return;
            }
            if (newPassword.length < 6) {
                showForgotPasswordMessage("New password must contain at least 6 characters.");
                newPasswordInput.focus();
                return;
            }
            if (newPassword !== confirmPassword) {
                showForgotPasswordMessage("The new passwords do not match.");
                confirmNewPasswordInput.focus();
                return;
            }
            resetPasswordButton.disabled = true;
            resetPasswordButtonText.textContent = "Resetting...";
            try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, code, newPassword })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.message || "Unable to reset the password.");
                showForgotPasswordMessage(data.message, "success");
                emailInput.value = email;
                setTimeout(() => { closeForgotPasswordModal(); passwordInput.value = ""; passwordInput.focus(); }, 1400);
            } catch (error) {
                showForgotPasswordMessage(error.message === "Failed to fetch" ? "Unable to connect to the server." : error.message);
            } finally {
                resetPasswordButton.disabled = false;
                resetPasswordButtonText.textContent = "Reset Password";
            }
        }

        forgotPasswordButton.addEventListener("click", openForgotPasswordModal);
        closeForgotPasswordButton.addEventListener("click", closeForgotPasswordModal);
        forgotPasswordBackdrop.addEventListener("click", closeForgotPasswordModal);
        forgotPasswordForm.addEventListener("submit", requestResetCode);
        resetPasswordForm.addEventListener("submit", resetPassword);
        toggleNewPasswordButton.addEventListener("click", toggleNewPasswordVisibility);
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && forgotPasswordModal.classList.contains("active")) {
                closeForgotPasswordModal();
            }
        });

        togglePasswordButton.addEventListener(
            "click",
            togglePasswordVisibility
        );

        loginForm.addEventListener(
            "submit",
            loginUser
        );


        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("/service-worker.js")
                        .then(function () {
                            console.log(
                                "Service worker registered."
                            );
                        })
                        .catch(function (error) {
                            console.error(
                                "Service worker registration failed:",
                                error
                            );
                        });

                }
            );

        }
    </script>

</body>

</html>
